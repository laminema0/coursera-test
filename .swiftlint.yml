included:
  - MyApp
  - MyAppTests
  - Packages/Core/Sources
  - Packages/DesignSystem/Sources
excluded:
  - "**/.build"
opt_in_rules:
  - empty_count
  - first_where
  - modifier_order
  - sorted_imports
analyzer_rules:
  - unused_import
line_length:
  warning: 140
  error: 200
identifier_name:
  min_length: 2
  excluded: [x, y]
type_body_length:
  warning: 300
file_length:
  warning: 500
