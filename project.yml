name: MyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Staging: Configs/Staging.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp
    dependencies:
      - package: Core
        product: CoreNetworking
      - package: Core
        product: CorePersistence
      - package: Core
        product: CoreLogging
      - package: DesignSystem
    info:
      path: MyApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        API_BASE_URL: $(API_BASE_URL)
        USE_MOCK_DATA: $(USE_MOCK_DATA)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if command -v swiftlint >/dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" "${SRCROOT}/MyApp"
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MyAppTests]
    dependencies:
      - target: MyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MyAppUITests]
    dependencies:
      - target: MyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [MyApp]
      targets:
        - MyAppTests
        - MyAppUITests
    archive:
      config: Release
  MyApp-Staging:
    build:
      targets:
        MyApp: all
    run:
      config: Staging
    archive:
      config: Staging
